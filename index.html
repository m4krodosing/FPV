  #overlay.hidden{display:none;}
  #ovPanel{width:100%;background:linear-gradient(180deg,transparent,rgba(3,8,4,0.88) 30%,rgba(2,6,3,0.96));padding:14px 18px 20px;display:flex;flex-direction:column;align-items:center;}
  .hitzone{position:absolute;left:123px;width:157px;background:transparent;border:none;padding:0;margin:0;pointer-events:all;cursor:pointer;-webkit-tap-highlight-color:transparent;appearance:none;-webkit-appearance:none;outline:none;}
  .hitzone:active{background:rgba(255,59,48,.18);border-radius:4px;}
  #hitStart{top:425px;height:36px;}
  #hitRecord{top:464px;height:33px;}
  #hitDrones{top:499px;height:36px;}
  #hitCredits{top:535px;height:33px;}
  #ovScoreWrap{position:absolute;top:378px;left:0;width:100%;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  #deathRecap{position:absolute;top:0;left:0;width:100%;height:100%;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;cursor:pointer;z-index:8;}
  #deathRecap.hidden{display:none;}
  #deathRecap .dr-tap-hint{margin-top:30px;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:3px;color:#888;animation:drpulse 1.4s ease-in-out infinite;}
  @keyframes drpulse{0%,100%{opacity:.4}50%{opacity:1}}
  #ovScoreWrap .pill{background:rgba(10,4,4,.85);border:1px solid #ff333355;border-radius:8px;padding:8px 22px;display:flex;flex-direction:column;align-items:center;}
  #subModal{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(6,3,3,0.96);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;padding:24px 20px;text-align:center;z-index:5;}
  #subModal.hidden{display:none;}
  #subModal h3{font-family:'Orbitron',monospace;color:#f2f2f2;letter-spacing:3px;font-size:16px;margin-bottom:18px;text-shadow:0 0 12px #ff333366;}
  .modal-big{font-family:'Orbitron',monospace;font-size:52px;font-weight:900;color:#ff3b30;text-shadow:0 0 20px #ff3b3088;margin-bottom:4px;}
  #subModalBody{max-height:420px;overflow-y:auto;width:100%;}
  .modal-drone-row{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px 0;border-bottom:1px solid #3a1a1a;font-size:11px;color:#d6b3b3;letter-spacing:1px;cursor:pointer;}
  .modal-drone-row.sel{background:rgba(255,59,48,.10);}
  .modal-drone-row.sel span{color:#ff3b30;}
  .modal-drone-row.locked-row{cursor:default;}
  .modal-drone-row canvas{flex-shrink:0;}
  .modal-drone-row .locked{color:#ff8844;}
  #subModal .ov-hint{color:#8a7070;font-size:11px;line-height:1.7;margin:0;}
  #subModalClose{margin-top:20px;font-family:'Orbitron',monospace;font-size:12px;color:#fff;background:linear-gradient(180deg,#a01818,#5c0d0d);border:1px solid #ffffff88;padding:10px 26px;letter-spacing:2px;cursor:pointer;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
  .ov-title{font-family:'Orbitron',monospace;font-size:34px;font-weight:900;color:#f2f2f2;text-shadow:0 0 20px #ff3b3088;letter-spacing:6px;margin-bottom:6px;}
  .ov-sub{font-size:11px;color:#8a7070;letter-spacing:3px;margin-bottom:24px;}
  .ov-score-label{font-size:11px;color:#a08080;letter-spacing:2px;margin-bottom:4px;}
  .ov-score{font-family:'Orbitron',monospace;font-size:46px;font-weight:900;color:#ff3b30;text-shadow:0 0 20px #ff3b3088;margin-bottom:6px;}
  .ov-best{font-size:12px;color:#c99;letter-spacing:2px;margin-bottom:28px;}
  .ov-btn{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(180deg,#a01818,#5c0d0d);border:1px solid #ffffff88;padding:13px 36px;letter-spacing:3px;cursor:pointer;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all .15s;}
  .ov-btn:hover{background:#00ffaa;transform:scale(1.05);}
  .ov-hint{margin-top:14px;font-size:10px;color:#7a6060;letter-spacing:1px;text-align:center;padding:0 20px;line-height:1.8;}
  #dropBtn{
    position:absolute;
    bottom:18px;
    right:16px;
    width:80px;
    height:80px;
    background:rgba(255,80,0,0.15);
    border:2px solid #ff6600aa;
    border-radius:50%;
    color:#ff6600;
    font-size:28px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    pointer-events:all;
    user-select:none;
    -webkit-user-select:none;
    transition:background .1s,transform .1s;
    font-family:'Share Tech Mono',monospace;
    gap:2px;
  }
  #dropBtn:active{background:rgba(255,80,0,0.4);transform:scale(0.92);}
  #dropBtn.empty{opacity:0.3;pointer-events:none;}
  #dropBtn span.lbl{font-size:9px;letter-spacing:1px;color:#ff8844;}
  #interStatus{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:10px;color:#ff3399;letter-spacing:3px;opacity:0;text-shadow:0 0 8px #ff339988;font-family:'Orbitron',monospace;white-space:nowrap;}
  /* ── drone picker ── */
  #picker{display:flex;gap:8px;overflow-x:auto;max-width:340px;padding:6px 4px 14px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
  #picker::-webkit-scrollbar{height:4px;}
  #picker::-webkit-scrollbar-thumb{background:#00ff8844;}

  try{
    const b=localStorage.getItem('fpvBest');if(b)best=parseInt(b)||0;

   ════════════════════════════════ */
let rebLines=[];
let rebGlitch=0,rebGlitchTimer=0,rebSlices=[];
let rebCooldown=300;
const REB_H=H*0.20; // 20% of screen height

function spawnReb(){
  // random Y so the rectangle appears at varied vertical positions
  const y=REB_H/2+Math.random()*(H*0.5);
  rebLines.push({
    y,          // center Y
    h:REB_H,    // full 20% height
    life:300,   // 5 seconds at 60fps
    alpha:0,fadeIn:true,
    pulse:Math.random()*Math.PI*2,
  });
}

function triggerGlitch(i){
  rebGlitch=Math.min(1,i);
  rebGlitchTimer=40+(i*50|0);
  buildSlices();
  $('rebStatus').style.opacity='1';
}
function buildSlices(){
  rebSlices=[];
  const n=5+(rebGlitch*10|0);
  for(let i=0;i<n;i++) rebSlices.push({y:Math.random()*H,h:3+Math.random()*26,dx:(Math.random()-.5)*28*rebGlitch,cyan:Math.random()>.5});
}
function stopGlitch(){rebGlitch=0;rebSlices=[];$('rebStatus').style.opacity='0';}

  setTimeout(()=>{if($('interStatus'))$('interStatus').style.opacity='0';},1800);
}

function spawnRadarStripe(){
  const y=RADAR_H/2+Math.random()*(H*0.55);
  radarStripes.push({
    y,         // center Y
    h:RADAR_H, // full 20% height
    life:360,
    alpha:0,fadeIn:true,
    pulse:Math.random()*Math.PI*2,
    scanX:0,   // horizontal scan line position
  });
}

function spawnFireSquad(){
  // з'являється з правого краю і, як і вся техніка, статична —
  // не рухається сама, лише скролиться разом зі світом справа наліво,
  // перетинає весь екран і зникає за лівим краєм
  const sx=W+40;
  // intensity scales with score: base interval shrinks, more soldiers possible
  const intensity=Math.min(score/20, 1); // 0..1, maxes out at score 20
  const baseTimer=Math.max(55, 150-score*2); // starts at 150, shrinks to 55
  fireSquad={
    x:sx,y:H-73,
    intensity,
    life:900,
    soldiers:[
      {ox:-18,alive:true,shootTimer:baseTimer+Math.random()*30|0},
      {ox:0,  alive:true,shootTimer:baseTimer*1.3+Math.random()*30|0},
      {ox:18, alive:true,shootTimer:baseTimer*1.6+Math.random()*30|0},
    ],
    bullets:[],
    hit:false,
  };
  fireWarning=true;
  $('radarStatus').style.opacity='1';
  setTimeout(()=>{ if($('radarStatus')) $('radarStatus').style.opacity='0'; },3000);
}

function onThrust(){
  if(state==='idle'||state==='dead')return;
  D.vy=rebGlitch>0?effTHR*(.35+Math.random()*.55):effTHR;
  D.thr=8;
  spawnThrust();
}
function onDrop(){
  if(state!=='playing'||bombCount<=0)return;
  bombCount--;
  bombs.push({x:D.x+D.w/2,y:D.y+D.h,vy:2});
  updateUI();
}

/* ════════════════════════════════
   GAME FLOW
   ════════════════════════════════ */
function startGame(){
  const dr=curDrone();
  effTHR=THR*dr.thrMul;effGRAV=GRAV*dr.gravMul;baseSPD=SPD*dr.spdMul;effSPD=baseSPD;
  state='playing';score=0;frame=0;killCount=0;bombCount=dr.bombs;
  Object.assign(D,{x:90,y:H/2,vy:0,angle:0,thr:0});
  nets=[];bombs=[];parts=[];tanks=[];interceptors=[];interCooldown=420;
  netsSinceTank=0;nextTankIn=2+Math.floor(Math.random()*3);
  rebLines=[];rebGlitch=0;rebGlitchTimer=0;rebSlices=[];rebCooldown=300;
  radarStripes=[];radarCooldown=500;
  detected=false;detectedTimer=0;fireSquad=null;fireWarning=false;mvgSpawnTimer=null;
  bgScrollX=0;
  $('overlay').classList.add('hidden');
  $('rebStatus').style.opacity='0';
  $('radarStatus').style.opacity='0';
  $('interStatus').style.opacity='0';
  updateUI();
}
let justUnlocked=null;
function gameOver(){
  state='dead';
  justUnlocked=null;
  if(score>best){
    const prevUnlocked=unlockedDrones().map(d=>d.id);
    best=score;saveBest();
    const newUnlocked=unlockedDrones().map(d=>d.id);
    const fresh=newUnlocked.filter(id=>!prevUnlocked.includes(id));
    if(fresh.length)justUnlocked=DRONES.find(d=>d.id===fresh[fresh.length-1]);
  }
  explode(D.x+D.w/2,D.y+D.h/2,'#ff4400',40);
  stopGlitch();
  $('radarStatus').style.opacity='0';
  $('interStatus').style.opacity='0';
  setTimeout(showDeathRecap,750);
}
function showDeathRecap(){
  $('drScore').textContent=score;
  $('drBest').textContent=(best>0?'BEST: '+best:'')+(justUnlocked?'   🔓 НОВИЙ ДРОН: '+justUnlocked.name.replace('\n',' '):'');
  $('overlay').classList.remove('hidden');
  $('deathRecap').classList.remove('hidden');
}
function showOverlay(){
  $('deathRecap').classList.add('hidden');
  $('overlay').classList.remove('hidden');
  $('ovPill').style.display='none';
  $('startBtn').textContent='[ START ]';
  renderPicker();
}

   SPAWN HELPERS

let netsSinceTank=0;
let nextTankIn=2+Math.floor(Math.random()*3);
function spawnNet(){
  const gap=Math.max(GAP_MIN,GAP_BASE-score*0.9);
  const topH=80+Math.random()*(H-gap-180);
  nets.push({x:W+NET_W,topH,gap,scored:false});
  // Техніка з'являється не на кожній сітці, а через 2-4 сітки, чергуючи тип
  netsSinceTank++;
  if(netsSinceTank>=nextTankIn){
    netsSinceTank=0;
    nextTankIn=2+Math.floor(Math.random()*3);
    const type=Math.random()<0.5?'grad':'t72';
    tanks.push({x:W+NET_W+120+Math.random()*60,y:H-68,hit:false,f:0,type});
  }
}
function spawnThrust(){
  const col=rebGlitch>0?'#ff3366':'#00ff88';
  for(let i=0;i<6;i++) parts.push({x:D.x+4+Math.random()*8,y:D.y+D.h/2+(Math.random()-.5)*8,vx:-(Math.random()*3+1),vy:(Math.random()-.5)*2,life:1,decay:.07+Math.random()*.06,r:Math.random()*3+1,col});
}
function explode(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=Math.random()*6+1;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.025+Math.random()*.04,r:Math.random()*4+1,col});
  }
}

/* ════════════════════════════════
   UPDATE
   ════════════════════════════════ */
function update(){
  frame++;
  stars.forEach(s=>{s.x-=s.s;if(s.x<0){s.x=W;s.y=Math.random()*H;}});
  if(state!=='playing')return;

  // політ поступово прискорюється з рахунком — до +55% на рахунку ~120
  effSPD=baseSPD*(1+Math.min(score/120,0.55));

  if(thrDown&&frame%3===0)spawnThrust();

  /* ── REB spawn / tick ── */
  if(--rebCooldown<=0&&rebLines.length<1){
    spawnReb();
    rebCooldown=400+Math.random()*200|0;
  }
  for(let i=rebLines.length-1;i>=0;i--){
    const rl=rebLines[i];
    rl.life--;
    if(rl.fadeIn){rl.alpha=Math.min(1,rl.alpha+.05);if(rl.alpha>=1)rl.fadeIn=false;}
    if(rl.life<60)rl.alpha=Math.max(0,rl.alpha-1/60);
    if(rl.life<=0){rebLines.splice(i,1);continue;}
    // collision: drone center inside REB rectangle
    const dcy=D.y+D.h/2;
    if(dcy>rl.y-rl.h/2&&dcy<rl.y+rl.h/2){
      if(rebGlitch<=0)triggerGlitch(.55+Math.random()*.45);
      else rebGlitchTimer=Math.max(rebGlitchTimer,15);
    }
  }
  if(rebGlitchTimer>0){
    rebGlitchTimer--;
    if(frame%4===0)buildSlices();
    if(rebGlitchTimer<=0)stopGlitch();
  }

  /* ── RADAR stripe spawn / tick ── */
  if(--radarCooldown<=0&&radarStripes.length<1&&!fireSquad){
    spawnRadarStripe();
    radarCooldown=600+Math.random()*300|0;
  }
  for(let i=radarStripes.length-1;i>=0;i--){
    const rs=radarStripes[i];
    rs.life--;
    rs.scanX=(rs.scanX+3)%W; // animate scan line inside rectangle
    if(rs.fadeIn){rs.alpha=Math.min(1,rs.alpha+.04);if(rs.alpha>=1)rs.fadeIn=false;}
    if(rs.life<60)rs.alpha=Math.max(0,rs.alpha-1/60);
    if(rs.life<=0){radarStripes.splice(i,1);detected=false;continue;}
    // detection: drone center inside radar rectangle
    const mid=D.y+D.h/2;
    if(mid>rs.y-rs.h/2&&mid<rs.y+rs.h/2){
      if(!detected){
        detected=true;detectedTimer=0;
        if(!fireSquad)mvgSpawnTimer=frame+300;
      }
    }
  }

  /* ── FIRE SQUAD (відкладена поява через 5 сек після виявлення) ── */
  if(mvgSpawnTimer!==null&&frame>=mvgSpawnTimer){
    mvgSpawnTimer=null;
    if(!fireSquad)spawnFireSquad();
  }
  if(fireSquad){
    // нерухома техніка — не рухається сама, але скролиться разом із землею,
    // як і все інше довкола (сітки, танки)
    fireSquad.x-=effSPD;

    const sq=fireSquad;
    const intensity=Math.min(score/20,1);
    const reloadTime=Math.max(45,150-score*2.5)|0;
    const bulletSpeed=4+intensity*4;        // 4..8
    const spread=0.95-intensity*0.30;       // 0.95..0.65 (ще менша кучність, значно ширший розкид)

    sq.soldiers.forEach(sol=>{
      if(!sol.alive)return;
      sol.shootTimer--;
      if(sol.shootTimer<=0){
        sol.shootTimer=reloadTime+Math.random()*reloadTime|0;
        const sx=sq.x+sol.ox, sy=sq.y-10;
        const dx=D.x+D.w/2-sx, dy=D.y+D.h/2-sy;
        const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const sp=(Math.random()-.5)*spread*bulletSpeed;
        sq.bullets.push({
          x:sx,y:sy,
          vx:dx/dist*bulletSpeed+sp,
          vy:dy/dist*bulletSpeed+sp,
          life:90
        });
      }
    });

    // move bullets
    for(let i=sq.bullets.length-1;i>=0;i--){
      const b=sq.bullets[i];
      b.x+=b.vx;b.y+=b.vy;b.life--;
      if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){sq.bullets.splice(i,1);continue;}
      // hit drone
      if(b.x>D.x+4&&b.x<D.x+D.w-4&&b.y>D.y+4&&b.y<D.y+D.h-4){
        if(INVINCIBLE){sq.bullets.splice(i,1);continue;}
        gameOver();return;
      }
    }

    // check if bomb hits squad
    for(let i=bombs.length-1;i>=0;i--){
      const bm=bombs[i];
      if(Math.abs(bm.x-sq.x)<62&&bm.y>sq.y-52&&bm.y<sq.y+20){
        // hit squad!
        sq.soldiers.forEach(sol=>{
          if(sol.alive){sol.alive=false;explode(sq.x+sol.ox,sq.y,'#ff8800',12);}
        });
        explode(sq.x,sq.y,'#ffcc00',30);
        sq.hit=true;
        score+=3;
        killCount++;
        bombCount+=2;
        updateUI();
        bombs.splice(i,1);
        fireSquad=null;
        detected=false;
        $('radarStatus').style.opacity='0';
        break;
      }
    }

    // squad off-screen left → disappear
    if(sq&&sq.x<-60){
      fireSquad=null;
      detected=false;
      $('radarStatus').style.opacity='0';
    }

    // група зникає лише коли повністю виходить за лівий край екрана
    // (не раніше — вона має перетнути весь екран)

    // МВГ зникає через час, якщо її не знищено
    if(sq){
      sq.life--;
      if(sq.life<=0){
        fireSquad=null;
        detected=false;
        $('radarStatus').style.opacity='0';
      }
    }
  }

  /* ── enemy interceptor drones ── */
  if(score>=6){
    const maxInterceptors=score>=70?3:score>=30?2:1;
    if(--interCooldown<=0&&interceptors.length<maxInterceptors){
      spawnInterceptor();
      interCooldown=(560-Math.min(score*3,260))+Math.random()*200|0;
    }
  }
  for(let i=interceptors.length-1;i>=0;i--){
    const it=interceptors[i];
    it.f++;
    const tx=D.x+D.w/2, ty=D.y+D.h/2;
    const dx=tx-it.x, dy=ty-it.y;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    // vx/vy — це маневр наведення (дельта), базовий зустрічний рух додається окремо нижче,
    // тому дрон завжди рухається узгоджено зі швидкістю польоту гравця (як і земля/сітки)
    const accel=0.09+Math.min(score/90,0.08);
    it.vx=(it.vx+(dx/dist)*accel)*0.975;
    it.vy=(it.vy+(dy/dist)*accel)*0.975;
    const maxSpd=it.spd;
    const curSpd=Math.sqrt(it.vx*it.vx+it.vy*it.vy)||1;
    if(curSpd>maxSpd){it.vx=it.vx/curSpd*maxSpd;it.vy=it.vy/curSpd*maxSpd;}
    it.y+=it.vy;
    // базовий зустрічний рух (effSPD) + маневр наведення (it.vx, макс ±половина effSPD) —
    // тому навіть на повному маневрі "навздогін" він не може рухатись вправо екраном,
    // лише повільніше відлітати вліво: гарантовано не наздожене гравця після проходу
    it.x+=it.vx-effSPD;
    if(it.x<-50||it.x>W+80){interceptors.splice(i,1);continue;}
    // collision with player
    if(D.x+6<it.x+it.type.w/2&&D.x+D.w-6>it.x-it.type.w/2&&D.y+4<it.y+it.type.h/2&&D.y+D.h-4>it.y-it.type.h/2){
      if(INVINCIBLE){explode(it.x,it.y,'#ff3399',10);interceptors.splice(i,1);continue;}
      gameOver();return;
    }
    // collision with bomb
    for(let j=bombs.length-1;j>=0;j--){
      const b=bombs[j];
      if(Math.abs(b.x-it.x)<it.type.w/2+4&&Math.abs(b.y-it.y)<it.type.h/2+6){
        explode(it.x,it.y,'#ff3399',24);
        score+=2;updateUI();
        bombs.splice(j,1);
        interceptors.splice(i,1);
        break;
      }
    }
  }

  /* ── drone physics ── */
  const grav=rebGlitch>0?effGRAV*(1+rebGlitch*.4*Math.sin(frame*.25)):effGRAV;
  D.vy=Math.min(D.vy+grav,MAXVY);
  if(rebGlitch>0&&frame%3===0)D.vy+=(Math.random()-.5)*rebGlitch*2.2;
  D.y+=D.vy;
  D.angle=Math.max(-25,Math.min(35,D.vy*3));
  if(D.thr>0)D.thr--;
  if(D.y<0){D.y=0;D.vy=0;}
  if(D.y+D.h>H-50){
    if(INVINCIBLE){D.y=H-50-D.h;D.vy=0;}
    else{gameOver();return;}
  }

  /* ── nets ── */
  if(frame%100===0||frame===1)spawnNet();
  for(let i=nets.length-1;i>=0;i--){
    nets[i].x-=effSPD;
    if(!nets[i].scored&&nets[i].x+NET_W<D.x){nets[i].scored=true;score++;updateUI();}
    if(nets[i].x+NET_W<-10)nets.splice(i,1);
  }
  // tanks
  for(let i=tanks.length-1;i>=0;i--){tanks[i].x-=effSPD;tanks[i].f++;if(tanks[i].x<-40)tanks.splice(i,1);}

  // net collision — net extends 46px to the LEFT of the post
  if(!INVINCIBLE)for(const n of nets){
    const dx=D.x+6,dw=D.w-12,dy=D.y+4,dh=D.h-8;
    const netLeft=n.x-46, netRight=n.x+6;
    if(dx+dw>netLeft&&dx<netRight)
      if(dy<n.topH||dy+dh>n.topH+n.gap){gameOver();return;}
  }

  /* ── bombs ── */
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i];
    b.vy+=.4;b.y+=b.vy;b.x-=effSPD;
    if(b.y>H-45){
      explode(b.x,H-45,'#ff6600',20);
      for(const t of tanks)if(!t.hit&&Math.abs(b.x-t.x)<65){t.hit=true;explode(t.x,t.y,'#ffcc00',28);score++;killCount++;bombCount++;updateUI();}
      bombs.splice(i,1);continue;
    }
    if(b.x<-20)bombs.splice(i,1);
  }

  /* ── particles ── */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=p.decay;
    if(p.life<=0)parts.splice(i,1);
  }
}

/* ════════════════════════════════
   DRAW
   ════════════════════════════════ */
function draw(){
  // background: bg1 scrolls once, then bg2 tiles forever
  const img1=BG_IMG.bg1, img2=BG_IMG.bg2;
  if(img1&&img1.complete&&img1.naturalWidth>0&&img2&&img2.complete&&img2.naturalWidth>0){
    const scale1=H/img1.naturalHeight, dw1=img1.naturalWidth*scale1;
    const scale2=H/img2.naturalHeight, dw2=img2.naturalWidth*scale2;
    if(state==='playing')bgScrollX+=effSPD*0.6;
    if(bgScrollX<dw1){
      ctx.drawImage(img1,-bgScrollX,0,dw1,H);
      const rem=dw1-bgScrollX;
      if(rem<W)ctx.drawImage(img2,rem,0,dw2,H);
    }else{
      const s=(bgScrollX-dw1)%dw2;
      let bx=-s;
      while(bx<W){ctx.drawImage(img2,bx,0,dw2,H);bx+=dw2;}
    }
  }else{
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#050d05');sky.addColorStop(.6,'#071207');sky.addColorStop(1,'#0a1a05');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    stars.forEach(s=>{
      ctx.globalAlpha=s.a*.7;ctx.fillStyle='#88ffaa';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.fillStyle='#0a1a08';ctx.beginPath();ctx.moveTo(0,H-80);
    for(let x=0;x<=W;x+=30)ctx.lineTo(x,H-80-Math.sin(x*.03+frame*.002)*18-Math.sin(x*.07)*10);
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  }
  if(rebGlitch>0){ctx.fillStyle=`rgba(80,0,20,${rebGlitch*.18})`;ctx.fillRect(0,0,W,H);}
  if(detected){ctx.fillStyle=`rgba(80,60,0,${.12+Math.sin(frame*.15)*.06})`;ctx.fillRect(0,0,W,H);}

  // ground collision strip (subtle overlay so the boundary reads clearly)
  const gr=ctx.createLinearGradient(0,H-52,0,H);
  gr.addColorStop(0,'rgba(15,25,10,0)');gr.addColorStop(1,'rgba(5,10,5,.55)');
  ctx.fillStyle=gr;ctx.fillRect(0,H-52,W,52);
  ctx.beginPath();ctx.moveTo(0,H-52);ctx.lineTo(W,H-52);ctx.strokeStyle='#2aff4433';ctx.stroke();

  // nets
  nets.forEach(n=>drawNet(n.x,n.topH,n.gap));

  // tanks
  tanks.forEach(t=>drawTank(t));

  // fire squad
  if(fireSquad)drawSquad(fireSquad);

  // enemy interceptor drones
  interceptors.forEach(it=>drawInterceptor(it));

  // bombs
  bombs.forEach(b=>drawBomb(b));

  // particles
  parts.forEach(p=>drawPart(p));

  // REB lines
  rebLines.forEach(rl=>drawRebLine(rl));

  // radar stripes
  radarStripes.forEach(rs=>drawRadarStripe(rs));

  // drone
  if(state!=='dead'||parts.length>20)drawDrone();

  // glitch
  if(rebGlitch>0)drawGlitch();

  // vignette
  const vig=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.8);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,.45)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  // HUD brackets
  ctx.strokeStyle=rebGlitch>0?'#ff004444':detected?'#ffcc0044':'#00ff4433';ctx.lineWidth=1;
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy])=>{
    const sx=cx===0?1:-1,sy=cy===0?1:-1;
    ctx.beginPath();ctx.moveTo(cx+sx*16,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+sy*16);ctx.stroke();
  });
  ctx.fillStyle=rebGlitch>0?'#ff004466':detected?'#ffcc0066':'#00ff4466';
  ctx.font='10px Share Tech Mono';
  ctx.fillText(`ALT ${((H-D.y)/H*100)|0}%`,10,H-60);
  ctx.fillText(`VEL ${D.vy.toFixed(1)}`,10,H-72);
  if(rebGlitch>0){ctx.fillStyle='#ff004488';ctx.fillText('SIGNAL ████░░ JAMMED',10,H-84);}
  if(detected){
    ctx.fillStyle=`rgba(255,200,0,${.6+Math.sin(frame*.2)*.4})`;
    ctx.fillText('⚠ DETECTED — EVADE!',10,H-84);
  }
}

/* ── draw: anti-drone net ── */
function drawNet(x,topH,gap){
  const postW=6;

  // Left post (vertical pole)
  ctx.fillStyle='#3a2010';
  ctx.fillRect(x,0,postW,topH);
  ctx.fillRect(x,topH+gap,postW,H-topH-gap);

  // Cap connectors (horizontal bar at gap edges)
  ctx.fillStyle='#5a3018';
  ctx.fillRect(x-3,topH-10,postW+6,10);
  ctx.fillRect(x-3,topH+gap,postW+6,10);

  // NET GRID stretched from post to left edge (drone approaches from left)
  // Top net section
  drawNetGrid(x-46,0,46,topH);
  // Bottom net section
  drawNetGrid(x-46,topH+gap,46,H-topH-gap);

  // Slight edge glow on net boundary
  ctx.save();
  ctx.strokeStyle='#aa601822';ctx.lineWidth=1;
  ctx.strokeRect(x-46,0,46,topH);
  ctx.strokeRect(x-46,topH+gap,46,H-topH-gap);
  ctx.restore();
}

function drawNetGrid(x,y,w,h){
  if(h<=0||w<=0)return;
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();

  const cell=11;
  // vertical strands
  ctx.strokeStyle='#7a4020aa';ctx.lineWidth=0.8;
  for(let lx=x;lx<=x+w;lx+=cell){
    ctx.beginPath();ctx.moveTo(lx,y);ctx.lineTo(lx,y+h);ctx.stroke();
  }
  // horizontal strands
  for(let ly=y;ly<=y+h;ly+=cell){
    ctx.beginPath();ctx.moveTo(x,ly);ctx.lineTo(x+w,ly);ctx.stroke();
  }
  // diagonal mesh
  ctx.strokeStyle='#9a501888';ctx.lineWidth=0.4;
  for(let d=-(h+w);d<w+h;d+=cell*1.4){
    ctx.beginPath();ctx.moveTo(x+d,y);ctx.lineTo(x+d+h,y+h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+d+h,y);ctx.lineTo(x+d,y+h);ctx.stroke();
  }
  // knot dots at intersections
  ctx.fillStyle='#cc7733';
  for(let lx=x;lx<=x+w;lx+=cell){
    for(let ly=y;ly<=y+h;ly+=cell){
      ctx.globalAlpha=0.5;
      ctx.beginPath();ctx.arc(lx,ly,1,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ── draw: drone ── */
function drawDrone(){
  ctx.save();
  ctx.translate(D.x+22,D.y+11);
  ctx.rotate(D.angle*Math.PI/180);

  if(rebGlitch>0){
    const sh=(Math.random()-.5)*rebGlitch*6;
    ctx.save();ctx.globalAlpha=.3*rebGlitch;
    ctx.fillStyle='#ff0044';ctx.beginPath();ctx.roundRect(-14+sh,-5,28,10,3);ctx.fill();
    ctx.fillStyle='#00ffff';ctx.beginPath();ctx.roundRect(-14-sh,-5,28,10,3);ctx.fill();
    ctx.restore();
  }

  const dr=curDrone();
  const spr=SPRITE_IMG[dr.id];
  const useSprite=spr&&spr.complete&&spr.naturalWidth>0;

  if(useSprite){
    const tw=52,th=tw*spr.naturalHeight/spr.naturalWidth;
    if(rebGlitch>0){
      const sh=(Math.random()-.5)*rebGlitch*7;
      ctx.save();ctx.globalAlpha=.35*rebGlitch;ctx.globalCompositeOperation='screen';
      ctx.filter='none';
      ctx.drawImage(spr,-tw/2+sh,-th/2,tw,th);
      ctx.restore();
    }
    if(D.thr>0){
      ctx.save();
      ctx.globalAlpha=.01;ctx.drawImage(spr,-tw/2,-th/2,tw,th);ctx.restore();
    }
    ctx.save();
    ctx.strokeStyle=rebGlitch>0?'#ff004466':detected?'#ffcc0066':'#00ff8855';
    
    ctx.drawImage(spr,-tw/2,-th/2,tw,th);
    ctx.restore();

    const rp=ROTOR_POS[dr.id];
    if(rp){
      rp.forEach(([fx,fy],i)=>{
        const rx=(fx-0.5)*tw, ry=(fy-0.5)*th;
        ctx.save();ctx.translate(rx,ry);
        const rl=tw*0.11;
        ctx.fillStyle='rgba(230,255,240,0.09)';
        ctx.beginPath();ctx.arc(0,0,rl*1.15,0,Math.PI*2);ctx.fill();
        ctx.rotate(frame*0.9*(i%2===0?1:-1));
        ctx.strokeStyle='rgba(225,255,235,0.4)';
        ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(-rl,0);ctx.lineTo(rl,0);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,-rl);ctx.lineTo(0,rl);ctx.stroke();
        ctx.restore();
      });
    }

    ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(0,th/2-3,2,0,Math.PI*2);ctx.fill();
  }else{
  if(dr.wing){
    // fixed-wing fuselage + swept wings
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(0,0,16,4,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=rebGlitch>0?'#ff004466':detected?'#ffcc0066':'#00ff8855';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-8,-9);ctx.lineTo(-8,9);ctx.closePath();ctx.fill();
    ctx.fillStyle='#00ccff44';ctx.beginPath();ctx.ellipse(10,-1,3,2,0,0,Math.PI*2);ctx.fill();
  }else{
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.roundRect(-14,-5,28,10,3);ctx.fill();
    ctx.strokeStyle=rebGlitch>0?'#ff004466':detected?'#ffcc0066':'#00ff8855';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(0,0,8,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#00ccff44';ctx.beginPath();ctx.ellipse(-1,-1,4,3,-.3,0,Math.PI*2);ctx.fill();
  }

  dr.rotors.forEach(([ax,ay],i)=>{
    ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ax,ay);ctx.stroke();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ax,ay,4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.stroke();
    ctx.save();ctx.translate(ax,ay);
    ctx.rotate(frame*.45*(i%2===0?1:-1));
    ctx.strokeStyle=rebGlitch>0?'#ff004499':(D.thr>0?'#00ff8888':'#33aa3366');
    ctx.lineWidth=1.5;
    const rl=dr.wing?9:6;
    ctx.beginPath();ctx.moveTo(-rl,0);ctx.lineTo(rl,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-rl);ctx.lineTo(0,rl);ctx.stroke();
    ctx.restore();
  });

  ctx.fillStyle='#333';ctx.beginPath();ctx.roundRect(-4,5,8,10,2);ctx.fill();
  ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(0,15,2,0,Math.PI*2);ctx.fill();
  }

  if(D.thr>0){
    
    ctx.strokeStyle=rebGlitch>0?'#ff004466':'#00ff8866';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

/* ── draw: REB ZONE rectangle (20% height) ── */
function drawRebLine(rl){
  const pulse=.5+.5*Math.sin(frame*.08+rl.pulse);
  const a=rl.alpha*pulse;
  const top=rl.y-rl.h/2, bot=rl.y+rl.h/2;

  ctx.save();

  // filled zone background
  const grd=ctx.createLinearGradient(0,top,0,bot);
  grd.addColorStop(0,'rgba(255,0,68,0)');
  grd.addColorStop(0.3,`rgba(140,0,40,${a*0.18})`);
  grd.addColorStop(0.7,`rgba(140,0,40,${a*0.18})`);
  grd.addColorStop(1,'rgba(255,0,68,0)');
  ctx.fillStyle=grd;
  ctx.fillRect(0,top,W,rl.h);

  // animated horizontal noise lines inside zone
  ctx.strokeStyle=`rgba(255,0,68,${a*0.25})`;ctx.lineWidth=0.5;
  for(let ly=top+6;ly<bot;ly+=10){
    ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();
  }

  // border top & bottom
  ctx.strokeStyle=`rgba(255,0,68,${a*0.9})`;ctx.lineWidth=1.5;
  
  ctx.setLineDash([10,6]);ctx.lineDashOffset=-(frame*1.8)%16;
  ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(W,top);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,bot);ctx.lineTo(W,bot);ctx.stroke();
  ctx.setLineDash([]);

  // side borders
  ctx.strokeStyle=`rgba(255,0,68,${a*0.5})`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(0,bot);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W,top);ctx.lineTo(W,bot);ctx.stroke();

  // floating labels inside zone
  ctx.globalAlpha=a*0.9;ctx.fillStyle='#ff2244';
  ctx.font='bold 9px Share Tech Mono';
  const lbs=['⚡ РЕБ','JAMMER','EW ZONE','BLOCK','⚡ РЕБ'];
  for(let lx=6;lx<W-10;lx+=76){
    ctx.fillText(lbs[Math.floor(lx/76)%lbs.length],lx,rl.y+3);
  }

  // time bar at right edge
  const pct=rl.life/300;
  ctx.globalAlpha=a*0.7;
  ctx.strokeStyle='#ff004466';ctx.lineWidth=1;
  ctx.strokeRect(W-8,top+2,4,rl.h-4);
  ctx.fillStyle=`rgba(255,0,68,${a})`;
  ctx.fillRect(W-8,top+2,4,(rl.h-4)*pct);

  ctx.restore();
}

/* ── draw: RADAR ZONE rectangle (20% height) ── */
function drawRadarStripe(rs){
  const pulse=.5+.5*Math.sin(frame*.1+rs.pulse);
  const a=rs.alpha*pulse;
  const top=rs.y-rs.h/2, bot=rs.y+rs.h/2;

  ctx.save();

  // filled zone background
  const grd=ctx.createLinearGradient(0,top,0,bot);
  grd.addColorStop(0,'rgba(255,200,0,0)');
  grd.addColorStop(0.3,`rgba(120,90,0,${a*0.18})`);
  grd.addColorStop(0.7,`rgba(120,90,0,${a*0.18})`);
  grd.addColorStop(1,'rgba(255,200,0,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,top,W,rs.h);

  // horizontal scan grid lines
  ctx.strokeStyle=`rgba(255,200,0,${a*0.2})`;ctx.lineWidth=0.5;
  for(let ly=top+6;ly<bot;ly+=10){
    ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();
  }

  // animated vertical scan beam sweeping across zone
  const scanX=rs.scanX||0;
  const scanGrd=ctx.createLinearGradient(scanX-20,0,scanX+20,0);
  scanGrd.addColorStop(0,'rgba(255,220,0,0)');
  scanGrd.addColorStop(0.5,`rgba(255,220,0,${a*0.4})`);
  scanGrd.addColorStop(1,'rgba(255,220,0,0)');
  ctx.fillStyle=scanGrd;
  ctx.fillRect(scanX-20,top,40,rs.h);

  // border top & bottom
  ctx.strokeStyle=`rgba(255,200,0,${a*0.9})`;ctx.lineWidth=1.5;
  
  ctx.setLineDash([8,5]);ctx.lineDashOffset=(frame*2)%13;
  ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(W,top);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,bot);ctx.lineTo(W,bot);ctx.stroke();
  ctx.setLineDash([]);

  // side borders
  ctx.strokeStyle=`rgba(255,200,0,${a*0.5})`;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,top);ctx.lineTo(0,bot);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W,top);ctx.lineTo(W,bot);ctx.stroke();

  // labels
  ctx.globalAlpha=a*0.9;ctx.fillStyle='#ffcc00';
  ctx.font='bold 9px Share Tech Mono';
  const lbs=['◉ RADAR','SCAN ZONE','DETECT','▶▶ EW'];
  for(let lx=6;lx<W-10;lx+=82){
    ctx.fillText(lbs[Math.floor(lx/82)%lbs.length],lx,rs.y+3);
  }

  // detection ring around drone if inside zone
  const mid=D.y+D.h/2;
  if(mid>top&&mid<bot){
    ctx.globalAlpha=0.7+Math.sin(frame*.3)*.3;
    ctx.strokeStyle='#ffcc00';ctx.lineWidth=1.5;
    
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(D.x+D.w/2,D.y+D.h/2,24,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

/* ── draw: fire squad ── */
function drawSquad(sq){
  const {x,y,soldiers,bullets}=sq;

  const img=MVG_SPRITE;
  if(img&&img.complete&&img.naturalWidth>0){
    const tw=70*2.1, th=tw*img.naturalHeight/img.naturalWidth;
    ctx.drawImage(img,x-tw/2,y-th+10,tw,th);
  }else{
    // fallback: sandbag cover
    ctx.fillStyle='#3a2a10';
    ctx.fillRect(x-30,y-4,60,8);
    ctx.fillStyle='#4a3618';
    ctx.fillRect(x-28,y-8,56,6);
  }

  // muzzle flash near the gun barrel when any soldier "shoots"
  soldiers.forEach(sol=>{
    if(!sol.alive)return;
    if(sol.shootTimer<3){
      ctx.fillStyle='#ffaa00';ctx.globalAlpha=.85;
      ctx.beginPath();ctx.arc(x+18,y-96,7,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  });

  // bullets
  bullets.forEach(b=>{
    ctx.save();
    ctx.fillStyle='#ffdd44';
    
    const angle=Math.atan2(b.vy,b.vx);
    ctx.translate(b.x,b.y);ctx.rotate(angle);
    ctx.fillRect(-5,-1.5,10,3);
    ctx.restore();
    // tracer trail
    ctx.strokeStyle='rgba(255,180,0,0.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*3,b.y-b.vy*3);ctx.stroke();
  });

  // warning arrow if not on screen yet
  if(x>W){
    const blink=Math.sin(frame*.2)>.3;
    if(blink){
      ctx.save();ctx.fillStyle='#ff4400';ctx.globalAlpha=.8;
      ctx.font='bold 14px Share Tech Mono';
      ctx.fillText('▶ ВОГНЕВА',W-90,y-6);
      ctx.restore();
    }
  }
}

/* ── draw: enemy interceptor drone ── */
function drawInterceptor(it){
  ctx.save();
  ctx.translate(it.x,it.y);
  const ang=Math.max(-20,Math.min(20,it.vy*4));
  ctx.rotate(ang*Math.PI/180);

  const spr=ENEMY_SPRITE;
  if(spr&&spr.complete&&spr.naturalWidth>0){
    const tw=it.type.w*2.1, th=tw*spr.naturalHeight/spr.naturalWidth;
    ctx.drawImage(spr,-tw/2,-th/2,tw,th);
    // обертові відблиски двигунів/гарматного вузла (щоб було видно "рух")
    [[-tw*0.36,-th*0.02],[-tw*0.30,th*0.24]].forEach(([ax,ay],i)=>{
      ctx.save();ctx.translate(ax,ay);
      ctx.fillStyle='rgba(255,90,60,0.32)';
      ctx.beginPath();ctx.arc(0,0,4.2,0,Math.PI*2);ctx.fill();
      ctx.rotate(it.f*1.4*(i%2===0?1:-1));
      ctx.strokeStyle='#ffccaacc';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-4.2,0);ctx.lineTo(4.2,0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,-4.2);ctx.lineTo(0,4.2);ctx.stroke();
      ctx.restore();
    });
  }else{
    ctx.fillStyle='#1a0a12';ctx.beginPath();ctx.roundRect(-it.type.w/2,-it.type.h/2,it.type.w,it.type.h,3);ctx.fill();
    ctx.strokeStyle='#ff339977';ctx.lineWidth=1;ctx.stroke();
  }

  // blinking nav light
  if(Math.sin(it.f*.3)>0){ctx.fillStyle='#ff0044';ctx.beginPath();ctx.arc(0,it.type.h/2+1,1.6,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

/* ── draw: tank ── */
function drawTank(t){
  if(t.hit)return;
  ctx.save();ctx.translate(t.x,t.y);
  const img=TANK_IMG[t.type];
  if(img&&img.complete&&img.naturalWidth>0){
    const tw=64*2.6,th=tw*img.naturalHeight/img.naturalWidth;
    ctx.drawImage(img,-tw/2,-th+6,tw,th);
  }else{
    const pulse=Math.sin(t.f*.1)*2;
    ctx.fillStyle='#1a3a10';ctx.fillRect(-14+pulse*.2,-9,28,12);
    ctx.fillStyle='#243a14';ctx.fillRect(-5,-14,10,8);ctx.fillRect(-1,-18,2,6);
    ctx.fillStyle='#111';[-10,0,10].forEach(wx=>{ctx.beginPath();ctx.arc(wx,4,4,0,Math.PI*2);ctx.fill();});
  }
  ctx.strokeStyle=`rgba(255,80,0,${.5+Math.sin(t.f*.15)*.3})`;
  ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,-6,10,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

/* ── draw: bomb ── */
function drawBomb(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,.5));
  ctx.fillStyle='#555';ctx.beginPath();ctx.ellipse(0,0,4,7,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#333';ctx.beginPath();ctx.moveTo(-3,6);ctx.lineTo(3,6);ctx.lineTo(0,12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#444';
  ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(-7,-10);ctx.lineTo(-2,-7);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(4,-4);ctx.lineTo(7,-10);ctx.lineTo(2,-7);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff660033';ctx.beginPath();ctx.ellipse(0,-8,2,5,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ── draw: particle ── */
function drawPart(p){
  ctx.save();ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle=p.col;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
}

/* ── draw: glitch ── */
function drawGlitch(){
  ctx.save();
  rebSlices.forEach(sl=>{
    ctx.drawImage(canvas,0,sl.y,W,sl.h,sl.dx,sl.y,W,sl.h);
    ctx.fillStyle=sl.cyan?'rgba(0,255,255,0.1)':'rgba(255,0,68,0.1)';
    ctx.fillRect(sl.dx,sl.y,W,sl.h);
  });
  ctx.globalCompositeOperation='screen';
  const cs=rebGlitch*5*Math.sin(frame*.3);
  ctx.globalAlpha=.07*rebGlitch;
  ctx.fillStyle='#ff0044';ctx.fillRect(cs,0,W,H);
  ctx.fillStyle='#00ffff';ctx.fillRect(-cs,0,W,H);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=.2*rebGlitch*Math.random();
  for(let i=0;i<4;i++)ctx.fillRect(0,Math.random()*H,W,1+Math.random()*5);
  if(rebGlitch>.4){
    ctx.globalAlpha=rebGlitch*.22;
    for(let i=0;i<90;i++){
      ctx.fillStyle=Math.random()>.5?'#ff0044':'#00ffff';
      ctx.fillRect(Math.random()*W,Math.random()*H,Math.random()*2+1,1);
    }
  }
  ctx.globalAlpha=1;ctx.restore();
}

/* ── drone picker UI ── */
function drawDroneIcon(c,dr,locked){
  const ictx=c.getContext('2d');
  const cx=c.width/2,cy=c.height/2;
  ictx.clearRect(0,0,c.width,c.height);
  const spr=SPRITE_IMG[dr.id];
  if(spr&&spr.complete&&spr.naturalWidth>0){
    const maxw=c.width-6,maxh=c.height-6;
    const sc=Math.min(maxw/spr.naturalWidth,maxh/spr.naturalHeight);
    const dw=spr.naturalWidth*sc,dh=spr.naturalHeight*sc;
    ictx.save();
    if(locked)ictx.filter='grayscale(1) brightness(.6)';
    ictx.drawImage(spr,cx-dw/2,cy-dh/2,dw,dh);
    ictx.restore();
    return;
  }
  ictx.save();ictx.translate(cx,cy);
  const col=locked?'#334433':'#00ff88';
  if(dr.wing){
    ictx.strokeStyle=col;ictx.lineWidth=1.3;
    ictx.beginPath();ictx.moveTo(0,-11);ictx.lineTo(-16,4);ictx.lineTo(-4,4);ictx.lineTo(0,10);ictx.lineTo(4,4);ictx.lineTo(16,4);ictx.closePath();ictx.stroke();
    ictx.fillStyle=col;ictx.beginPath();ictx.arc(0,-11,2,0,Math.PI*2);ictx.fill();
  }else{
    ictx.fillStyle=locked?'#222':'#181818';ictx.beginPath();ictx.arc(0,0,4,0,Math.PI*2);ictx.fill();
    dr.rotors.forEach(([ax,ay])=>{
      ictx.strokeStyle=col;ictx.lineWidth=1;
      ictx.beginPath();ictx.moveTo(0,0);ictx.lineTo(ax*.85,ay*.85);ictx.stroke();
      ictx.beginPath();ictx.arc(ax*.85,ay*.85,2.6,0,Math.PI*2);ictx.stroke();
    });
  }
  ictx.restore();
}
function renderPicker(){
  const pk=$('picker');pk.innerHTML='';
  DRONES.forEach(dr=>{
    const locked=isLocked(dr);
    const card=document.createElement('div');
    card.className='dr-card'+(locked?' locked':'')+(dr.id===selectedDrone?' sel':'');
    const cv=document.createElement('canvas');cv.width=44;cv.height=44;
    card.appendChild(cv);
    const nm=document.createElement('div');nm.className='dr-name';
    nm.innerHTML=dr.name.replace('\n','<br>');
    card.appendChild(nm);
    if(locked){const lk=document.createElement('div');lk.className='dr-lock';lk.textContent='🔒 '+dr.unlock;card.appendChild(lk);}
    if(!locked)card.addEventListener('click',()=>{selectedDrone=dr.id;saveSelected();renderPicker();});
    pk.appendChild(card);
    drawDroneIcon(cv,dr,locked);
  });
}

  let html='';
  if(kind==='record'){
    html=`<h3>🏆 РЕКОРД</h3><div class="modal-big">${best}</div><div class="ov-hint">найкращий результат за весь час</div>`;
  }else if(kind==='drones'){
    html='<h3>🚁 ДРОНИ</h3><div id="modalDronesList"></div><div class="ov-hint">тапни на розблокований дрон, щоб обрати його</div>';
  }else if(kind==='credits'){
    html=`<h3>💀 КРЕДИТИ</h3><div class="modal-big" style="font-size:26px;letter-spacing:3px;">COMING SOON</div>`;
  }
  $('subModalBody').innerHTML=html;
  $('subModal').classList.remove('hidden');
  if(kind==='drones')renderDronesModalList();
}
function renderDronesModalList(){
  const list=$('modalDronesList');
  if(!list)return;
  list.innerHTML='';
  DRONES.forEach(dr=>{
    const locked=isLocked(dr);
    const row=document.createElement('div');
    row.className='modal-drone-row'+(dr.id===selectedDrone?' sel':'')+(locked?' locked-row':'');
    const cv=document.createElement('canvas');cv.width=40;cv.height=40;
    row.appendChild(cv);
    const lbl=document.createElement('span');
    lbl.className=locked?'locked':'';
    lbl.textContent=dr.name.replace('\n',' ')+(locked?' — 🔒 потрібно '+dr.unlock+' очок':(dr.id===selectedDrone?' — ОБРАНО':''));
    row.appendChild(lbl);
    if(!locked){
      row.addEventListener('click',()=>{
        selectedDrone=dr.id;saveSelected();
        renderDronesModalList();
        renderPicker();
      });
    }
    list.appendChild(row);
    drawDroneIcon(cv,dr,locked);
  });
}
$('hitRecord').addEventListener('click',e=>{e.stopPropagation();showSubModal('record');});
$('hitDrones').addEventListener('click',e=>{e.stopPropagation();showSubModal('drones');});
$('hitCredits').addEventListener('click',e=>{e.stopPropagation();showSubModal('credits');});
$('subModalClose').addEventListener('click',e=>{e.stopPropagation();$('subModal').classList.add('hidden');});

loop();
</script>
</body>
</html>
