<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FPV DROP — Drone Strike</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
  
  /* Додано: touch-action: none щоб уникнути зайвих жестів браузера */
  *{margin:0;padding:0;box-sizing:border-box; touch-action: none;}
  
  body{
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
    font-family:'Share Tech Mono',monospace;
    /* Вимикаємо виділення тексту */
    -webkit-user-select: none;
    user-select: none;
  }
  #gw{position:relative;width:400px;height:600px;}
  canvas{display:block;border:1px solid #1a3a1a;box-shadow:0 0 40px #00ff4422,0 0 80px #00ff4411;}
  #ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  #score{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:28px;font-weight:900;color:#00ff88;text-shadow:0 0 10px #00ff8866;letter-spacing:4px;}
  #drops{position:absolute;top:14px;right:14px;font-size:12px;color:#ff6600;letter-spacing:1px;}
  #rebStatus{position:absolute;top:46px;left:50%;transform:translateX(-50%);font-size:10px;color:#ff0044;letter-spacing:3px;opacity:0;text-shadow:0 0 8px #ff004488;font-family:'Orbitron',monospace;white-space:nowrap;}
  #radarStatus{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffcc00;letter-spacing:3px;opacity:0;text-shadow:0 0 8px #ffcc0088;font-family:'Orbitron',monospace;white-space:nowrap;}
  #scanline{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,68,0.015) 2px,rgba(0,255,68,0.015) 4px);pointer-events:none;}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.87);pointer-events:all;}
  #overlay.hidden{display:none;}
  .ov-title{font-family:'Orbitron',monospace;font-size:34px;font-weight:900;color:#00ff88;text-shadow:0 0 20px #00ff88;letter-spacing:6px;margin-bottom:6px;}
  .ov-sub{font-size:11px;color:#446644;letter-spacing:3px;margin-bottom:24px;}
  .ov-score-label{font-size:11px;color:#556655;letter-spacing:2px;margin-bottom:4px;}
  .ov-score{font-family:'Orbitron',monospace;font-size:46px;font-weight:900;color:#ff6600;text-shadow:0 0 20px #ff660088;margin-bottom:6px;}
  .ov-best{font-size:12px;color:#668866;letter-spacing:2px;margin-bottom:28px;}
  .ov-btn{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:#000;background:#00ff88;border:none;padding:13px 36px;letter-spacing:3px;cursor:pointer;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all .15s;}
  .ov-btn:hover{background:#00ffaa;transform:scale(1.05);}
  .ov-hint{margin-top:14px;font-size:10px;color:#334433;letter-spacing:1px;text-align:center;padding:0 20px;line-height:1.8;}
  #dropBtn, #thrustBtn {
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;
    pointer-events:all;
    font-family:'Share Tech Mono',monospace;
    gap:2px;
    /* Заборона системних меню при довгому натисканні */
    -webkit-touch-callout: none;
  }
  #dropBtn{
    bottom:18px;
    right:16px;
    background:rgba(255,80,0,0.15);
    border:2px solid #ff6600aa;
    color:#ff6600;
    font-size:28px;
  }
  #thrustBtn{
    bottom:18px;
    left:16px;
    background:rgba(0,255,136,0.1);
    border:2px solid #00ff8866;
    color:#00ff88;
    font-size:28px;
  }
  #dropBtn:active{background:rgba(255,80,0,0.4);transform:scale(0.92);}
  #thrustBtn:active{background:rgba(0,255,136,0.3);transform:scale(0.92);}
</style>
</head>
<body>
<div id="gw">
  <canvas id="c" width="400" height="600"></canvas>
  <div id="ui">
    <div id="scanline"></div>
    <div id="score">00</div>
    <div id="drops">💣 3</div>
    <div id="rebStatus">⚡ РЕБ АКТИВНИЙ</div>
    <div id="radarStatus">📡 ВИЯВЛЕНО — ВОГНЕВА ГРУПА!</div>
    <button id="thrustBtn">▲<span class="lbl">ТЯГА</span></button>
    <button id="dropBtn">💣<span class="lbl">СКИД</span></button>
  </div>
  <div id="overlay">
    <div class="ov-title">FPV DROP</div>
    <div class="ov-sub">DRONE STRIKE MISSION</div>
    <div class="ov-score-label" id="ovScoreLabel" style="display:none">SCORE</div>
    <div class="ov-score"       id="ovScore"      style="display:none">0</div>
    <div class="ov-best"        id="ovBest"></div>
    <button class="ov-btn" id="startBtn">[ LAUNCH ]</button>
    <div class="ov-hint">
      SPACE / TAP — тяга<br>
      F — скинути бомбу на ціль<br>
      Уникай: сіток · РЕБ · радару<br>
      Виявлений — маневруй від куль!
    </div>
  </div>
</div>

</body>
</html>
